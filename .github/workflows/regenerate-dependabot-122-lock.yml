name: Regenerate Dependabot 122 lock

on:
  push:
    branches:
      - fix/dependabot-122-current-dev

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit regenerated lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-dependabot-122-lock.yml
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate production lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
