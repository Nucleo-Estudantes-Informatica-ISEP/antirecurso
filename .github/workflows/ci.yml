name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    # Playwright 1.59.1 needs a runner with supported Chromium system packages.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm test
          node --test .github/scripts/sync-board-issues.test.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated recovery browser check
        run: pnpm test:e2e:auth

      - name: Production build
        env:
          NEXT_PUBLIC_BASE_URL: /api/public
        run: pnpm build

      - name: Browser workflows
        run: pnpm test:e2e

      - name: Docker build with Coolify NODE_ENV
        run: docker build --target builder --build-arg NODE_ENV=development .

      - name: Reject critical production dependency advisories
        run: pnpm audit --prod --audit-level=critical
