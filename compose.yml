services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://antirecurso-api.nei-isep.org}
        NEXT_PUBLIC_PROTECTED_API_BASE_URL: ${NEXT_PUBLIC_PROTECTED_API_BASE_URL:-${SERVICE_URL_WEB_3000:-http://localhost:3000}/api/backend}
    environment:
      # Ask Coolify to generate/manage the public URL for the web service and
      # route it explicitly to the Next.js container port.
      SERVICE_URL_WEB_3000: /

      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}

      # Public frontend URLs are derived from Coolify's generated service URL.
      # Local docker compose falls back to localhost when the magic variable is absent.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${SERVICE_URL_WEB_3000:-http://localhost:3000}}
      AUTH_POST_LOGOUT_REDIRECT_URI: ${AUTH_POST_LOGOUT_REDIRECT_URI:-${SERVICE_URL_WEB_3000:-http://localhost:3000}}

      # Coolify generates a persistent random Auth.js secret automatically. Local
      # compose gets a development-only fallback unless AUTH_SECRET is supplied.
      AUTH_SECRET: ${AUTH_SECRET:-${SERVICE_REALBASE64_64_AUTH:-development-only-antirecurso-auth-secret-change-me}}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-https://auth.nei-isep.org}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:?Configure AUTH_CLIENT_ID in Coolify}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?Configure AUTH_CLIENT_SECRET in Coolify}

      # These IDs come from the AuthNEI bootstrap output. The application project
      # is the API audience; NEI Global carries the shared admin role.
      AUTH_PROJECT_ID: ${AUTH_PROJECT_ID:?Configure AUTH_PROJECT_ID in Coolify}
      AUTH_GLOBAL_PROJECT_ID: ${AUTH_GLOBAL_PROJECT_ID:?Configure AUTH_GLOBAL_PROJECT_ID in Coolify}
      AUTH_SCOPES: ${AUTH_SCOPES:-openid email profile offline_access urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:${AUTH_PROJECT_ID}:aud urn:zitadel:iam:org:project:id:${AUTH_GLOBAL_PROJECT_ID}:aud}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_GLOBAL_PROJECT_ID}:roles}
      AUTH_DEBUG: ${AUTH_DEBUG:-false}

      # NEXT_PUBLIC_BASE_URL is the external Adonis API. Authenticated browser
      # traffic uses the same-origin Next.js proxy instead of pointing the proxy at itself.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://antirecurso-api.nei-isep.org}
      NEXT_PUBLIC_PROTECTED_API_BASE_URL: ${NEXT_PUBLIC_PROTECTED_API_BASE_URL:-${SERVICE_URL_WEB_3000:-http://localhost:3000}/api/backend}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
